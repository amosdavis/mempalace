[package]
name = "mp"
version = "3.3.3"
edition = "2021"

[[bin]]
name = "mempalace"
path = "src/main.rs"

[dependencies]
mempalace = { path = "../mempalace" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
